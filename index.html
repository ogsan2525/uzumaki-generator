<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渦巻きエディター</title><style>*{box-sizing:border-box}body{margin:0;background:#12121a;color:#f4f2ff;font-family:system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 8px}p{color:#bdb9d0;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 340px;gap:20px}canvas{width:100%;aspect-ratio:1;background:#000;border-radius:12px}aside{background:#222130;padding:18px;border-radius:12px;max-height:82vh;overflow:auto}label{display:block;margin:13px 0 4px;font-size:14px}.v{float:right;color:#ffbe69}input[type=range]{width:100%;accent-color:#a769ff}input[type=color]{display:block;width:100%;height:44px;padding:0;border:2px solid #706782;border-radius:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer;overflow:hidden}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:0}input[type=color]::-moz-color-swatch{border:0;border-radius:0}input[type=number],select{width:100%;padding:10px;border-radius:7px;background:#171622;color:#f4f2ff;border:1px solid #59536e}.size-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.size-grid label{margin:6px 0}.hint{font-size:12px}button{border:0;background:#8240ef;color:white;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;margin:8px 5px 0 0}.secondary{background:#48425b}small{color:#bdb9d0;display:block;margin-top:10px} @media(max-width:750px){.layout{grid-template-columns:1fr}aside{max-height:none}}</style><div class="wrap"><h1>🌀 遠近感つき渦巻きエディター</h1><p>参考MV風の、中心へ巻き込む2色の帯。内側と外側の帯幅を別々に調整してPNG保存できます。</p><div class="layout"><div><canvas id="cv" width="700" height="700"></canvas><div><button id="save">PNG保存（2600×2600）</button><button id="reset" class="secondary">初期値に戻す</button></div><small>※ プレビューは正方形。PNG保存時に指定した縦横サイズで出力します。AviUtl2で回転するときは画面を覆う大きさで配置してください。</small></div><aside id="controls"><h3>PNGの書き出しサイズ</h3><label for="sizePreset">サイズのプリセット</label><select id="sizePreset"><option value="2600x2600">正方形（2600 × 2600）</option><option value="1920x1080">YouTube・横長（1920 × 1080）</option><option value="1080x1920">TikTok・ショート（1080 × 1920）</option><option value="3840x2160">4K・横長（3840 × 2160）</option><option value="custom">カスタム</option></select><div class="size-grid"><label for="outWidth">横幅（px）<input id="outWidth" type="number" min="64" max="6000" step="1" value="2600"></label><label for="outHeight">高さ（px）<input id="outHeight" type="number" min="64" max="6000" step="1" value="2600"></label></div><small id="sizeNote">保存画像：2600 × 2600 px。縦横比を変えても渦巻きは歪みません。</small><h3>模様の形</h3><div id="sliders"></div><h3>色</h3><label>オレンジ<input id="orange" type="color" value="#ff8500"></label><label>紫<input id="purple" type="color" value="#390076"></label><label><input id="shade" type="checkbox" checked> 中心付近に陰影をつける</label><label><input id="previewRotate" type="checkbox"> 回転プレビュー</label><small>「帯の幅」はオレンジ色の占める割合です。外側の間隔を大きく、内側の間隔を小さくすると、中心へ向かって帯が細くなります。</small></aside></div></div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const defs=[['spacing','外側の巻き間隔',12,220,115,1,'px'],['innerSpacing','内側の巻き間隔',4,120,15,1,'px'],['taper','内外の幅変化',0.3,4,1.5,0.1,'倍'],['thickness','オレンジの帯幅',10,90,50,1,'%'],['angle','開始角度',0,360,0,1,'°'],['twist','巻く方向・強さ',-2,2,1,0.05,'倍'],['core','中心の大きさ',0,160,0,1,'px'],['centerX','中心 X',-150,150,0,1,'px'],['centerY','中心 Y',-150,150,0,1,'px'],['contrast','陰影の強さ',0,75,22,1,'%']];const values={};let timer=0;for(const [id,name,min,max,def,step,unit] of defs){values[id]=def;const l=document.createElement('label');l.innerHTML=`${name}<span class="v" id="v_${id}">${def}${unit}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${def}">`;document.getElementById('sliders').append(l);l.querySelector('input').addEventListener('input',e=>{values[id]=+e.target.value;document.getElementById('v_'+id).textContent=e.target.value+unit;render()})}const orange=document.getElementById('orange'),purple=document.getElementById('purple'),shade=document.getElementById('shade');[orange,purple,shade].forEach(e=>e.addEventListener('input',render));function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}function renderTo(canvas,width,height,rotation=0){const context=canvas.getContext('2d',{willReadFrequently:true});const img=context.createImageData(width,height),d=img.data,aa=rgb(orange.value),bb=rgb(purple.value);const scale=Math.min(width,height)/700,spacing=values.spacing*scale,core=values.core*scale,cx=width/2+values.centerX*scale,cy=height/2+values.centerY*scale,theta0=(values.angle+rotation)*Math.PI/180,turn=values.twist;const TAU=2*Math.PI,th=values.thickness/100;const maxR=Math.ceil(Math.hypot(width,height))+2;const radialPhase=new Float64Array(maxR+1);const outerR=Math.min(width,height)*0.72;for(let j=1;j<=maxR;j++){const f=Math.min(1,j/outerR);const width=(values.innerSpacing+(values.spacing-values.innerSpacing)*Math.pow(f,values.taper))*scale;radialPhase[j]=radialPhase[j-1]+1/Math.max(1,width)}const coreIndex=Math.max(0,Math.min(maxR,Math.round(core)));for(let y=0;y<height;y++){for(let x=0;x<width;x++){const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);const ri=Math.min(maxR-1,Math.floor(r));let u=(radialPhase[ri]+(radialPhase[ri+1]-radialPhase[ri])*(r-ri)-radialPhase[coreIndex])-turn*(ang-theta0)/TAU;let phase=((u%1)+1)%1;const localSpacing=(values.innerSpacing+(values.spacing-values.innerSpacing)*Math.pow(Math.min(1,r/outerR),values.taper))*scale;let blend=Math.min(1,Math.max(0,(phase-th)*Math.max(1,localSpacing)*2+0.5));if(phase>0.98 && th<0.98){blend=Math.min(blend,Math.max(0,(1-phase)*localSpacing*2))}const shadow=shade.checked?(1-(values.contrast/100)*Math.exp(-r/(135*scale))):1;let i=(y*width+x)*4;for(let k=0;k<3;k++)d[i+k]=Math.round((aa[k]*(1-blend)+bb[k]*blend)*shadow);d[i+3]=255}}context.putImageData(img,0,0)}function render(){renderTo(cv,700,700,timer)}const sizePreset=document.getElementById('sizePreset'),outWidth=document.getElementById('outWidth'),outHeight=document.getElementById('outHeight'),sizeNote=document.getElementById('sizeNote'),saveButton=document.getElementById('save');function dimensions(){const w=Number(outWidth.value),h=Number(outHeight.value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<64||h<64||w>6000||h>6000){return null}if(w*h>16000000){return null}return [w,h]}function updateSize(){const d=dimensions();sizeNote.textContent=d?`保存画像：${d[0]} × ${d[1]} px。縦横比を変えても渦巻きは歪みません。`:'幅・高さは64〜6000px、合計1600万画素以下にしてください。';saveButton.disabled=!d;saveButton.textContent=d?`PNG保存（${d[0]}×${d[1]}）`:'サイズを確認してください';saveButton.style.opacity=d?'1':'0.5'}sizePreset.addEventListener('change',()=>{if(sizePreset.value!=='custom'){const [w,h]=sizePreset.value.split('x');outWidth.value=w;outHeight.value=h}updateSize()});[outWidth,outHeight].forEach(el=>el.addEventListener('input',()=>{sizePreset.value='custom';updateSize()}));saveButton.onclick=()=>{const d=dimensions();if(!d)return;const [w,h]=d;const c=document.createElement('canvas');c.width=w;c.height=h;saveButton.disabled=true;saveButton.textContent='PNGを生成中…';setTimeout(()=>{try{renderTo(c,w,h,0);c.toBlob(blob=>{if(!blob){alert('PNG保存に失敗しました。画像サイズを小さくして再試行してください。');updateSize();return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`uzumaki_${w}x${h}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);updateSize()},'image/png')}catch(e){alert('画像の生成に失敗しました。サイズを小さくしてお試しください。');updateSize()}},30)};updateSize();document.getElementById('reset').onclick=()=>{for(const [id,n,min,max,def,step,unit] of defs){values[id]=def;document.getElementById(id).value=def;document.getElementById('v_'+id).textContent=def+unit}orange.value='#ff8500';purple.value='#390076';shade.checked=true;render()};let last=0;function loop(t){if(document.getElementById('previewRotate').checked&&t-last>50){timer=(timer+1.5)%360;render();last=t}requestAnimationFrame(loop)}render();requestAnimationFrame(loop);
</script></html>
